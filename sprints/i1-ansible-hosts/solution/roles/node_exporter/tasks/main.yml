- name: Системний користувач без shell і home
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Завантажити реліз (checksum з офіційного sha256sums.txt)
  ansible.builtin.get_url:
    url: "{{ node_exporter_base_url }}/{{ node_exporter_release }}.tar.gz"
    dest: "/tmp/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
    mode: "0644"

- name: Розпакувати
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_release }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "{{ node_exporter_install_dir }}/node_exporter"

- name: Бінарник у /usr/local/bin (нова версія -> перезапуск)
  ansible.builtin.copy:
    src: "{{ node_exporter_install_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Unit-файл systemd
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Сервіс node_exporter увімкнено і запущено
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Застосувати відкладені перезапуски до перевірки
  ansible.builtin.meta: flush_handlers

- name: Метрики віддаються
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_listen.split(':')[-1] }}/metrics"
    return_content: false
  register: node_exporter_check
  until: node_exporter_check.status == 200
  retries: 5
  delay: 2
  changed_when: false
