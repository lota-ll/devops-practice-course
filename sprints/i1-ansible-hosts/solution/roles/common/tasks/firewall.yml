- name: Правила nftables (перевіряються `nft -c` перед записом)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Сервіс nftables увімкнено і запущено
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
