- name: Перевірити, що ОС підтримується
  ansible.builtin.assert:
    that: ansible_facts.os_family == "Debian"
    fail_msg: "Роль розрахована на Debian/Ubuntu/Raspberry Pi OS, а тут {{ ansible_facts.distribution }}"
    quiet: true

- name: Встановити базові пакети
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Часовий пояс
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: SSH-ключ адміністратора (до того, як вимкнемо паролі)
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ common_admin_ssh_pubkey }}"
    state: present
  when: common_admin_ssh_pubkey | length > 0

- name: Не вимикати паролі, якщо ключ не задано — інакше втратимо доступ
  ansible.builtin.assert:
    that: common_ssh_password_authentication or common_admin_ssh_pubkey | length > 0
    fail_msg: "common_admin_ssh_pubkey порожній, а common_ssh_password_authentication=false"
    quiet: true

- name: SSH hardening (drop-in, перевіряється sshd перед записом)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Автоматичні оновлення безпеки
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 52unattended-upgrades-local

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: common_firewall_enabled
  tags: [firewall]
