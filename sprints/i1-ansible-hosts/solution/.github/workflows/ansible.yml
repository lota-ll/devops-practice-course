name: ansible

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install "ansible-core==2.22.0" "ansible-lint==26.11.0"
      - run: ansible-galaxy collection install -r requirements.yml
      # Хостів у CI немає: перевіряємо синтаксис і якість, а не застосування
      - run: ansible-lint
      - run: ansible-playbook --syntax-check playbooks/*.yml
