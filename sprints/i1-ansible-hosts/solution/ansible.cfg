[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Перевірку ключа хоста НЕ вимикаємо: перше підключення — вручну `ssh user@host`
host_key_checking = True
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
retry_files_enabled = False

[ssh_connection]
# Менше SSH-з'єднань на задачу: помітно швидше, особливо через VPN
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
